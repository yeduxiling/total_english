<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Total English Clipper Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      padding: 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    h2 {
      font-size: 20px;
      margin-top: 0;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 13.5px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .form-group {
      margin: 24px 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e4e4e7;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .status-error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body>
  <h2><span>⚙️</span> Total English Clipper Settings</h2>
  <p>Configure the server address where clipped articles will be saved and opened.</p>

  <div class="form-group">
    <label for="serverUrl">Total English Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://your-domain.com or http://localhost:5173" required>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="saveBtn">Save & Test Connection</button>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <script src="options.js"></script>
</body>
</html>
